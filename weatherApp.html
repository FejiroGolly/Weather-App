<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="weatherApp.css">
    <title>Weather App</title>
</head>
<body>

    <div class="card">

        <div class="search">
            <input type="text" placeholder="New York" spellcheck="false">
            <button><img class="searchimg" src="./images/search.png" alt=""></button>
        </div>

        <div class="error">
            <p>Invalid City Name</p>
        </div>

        <div class="weather">

            <img class="weatherimg" src="" >
            <h1 class="temp"></h1>
            <h2 class="city"></h2>

            <div class="details">

                <div class="col">

                    <img src="./images/humidity.png" class="weatherimg">

                    <div class="humdiv">
                        <p class="humidity"></p>
                        <p></p>
                    </div>

                </div>


                <div class="col">
                
                    <img src="./images/wind.png" class="weatherimg">
                
                    <div class="windiv">
                        <p class="wind">15km/hr </p>
                        <p>Wind Speed</p>
                    </div>
                
                </div>

            </div>

            </div>

    </div>

    <script>

        const apiKey = "261e0aa01fa8121fac386b8bb9619191";
        const apiUrl =  "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");

        const weatherIcon = document.querySelector(".weatherimg")

       


        async function checkWeather(city="new york"){


            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if(response.status == 404){
                document.querySelector(".error").style.display = "block"
                document.querySelector(".weather").style.display = "none"

            }
            else{

            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);


                 var data = await response.json();


                console.log(data);


                 document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/hr";



                if (data.weather[0].main == "Clouds") {
                    weatherIcon.src = "./images/cloud.png"
                }
                else if (data.weather[0].main == "Clear") {
                    weatherIcon.src = "./images/thejujuala-sun-1265199_1920.png"
                }
                else if (data.weather[0].main == "Rain") {
                    weatherIcon.src = "./images/rain.png"
                }
                else if (data.weather[0].main == "Drizzle") {
                    weatherIcon.src = "./images/rainy-day.png"
                }
                else if (data.weather[0].main == "Mist") {
                    weatherIcon.src = "./images/cloudy.png"
                }
                else if (data.weather[0].main == "Mist") {
                    weatherIcon.src = "./images/snowflake.png"
                }


                 document.querySelector(".error").style.display = "none"



                searchBtn.addEventListener("click", () => {
                    checkWeather(searchBox.value);
                    document.querySelector(".weather").style.display = "block"

                })

            }


            // var data = await response.json();


            // console.log(data);


            // document.querySelector(".city").innerHTML = data.name;
            // document.querySelector(".temp").innerHTML = Math.round(data.main.temp)  + "°C";
            // document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            // document.querySelector(".wind").innerHTML = data.wind.speed  +  " km/hr";



            // if(data.weather[0].main == "Clouds"){
            //     weatherIcon.src = "cloud.png"
            // }
            // else if (data.weather[0].main == "Clear"){
            //     weatherIcon.src = "theujulala-sun-1265199_1920.png"
            // }
            //  else if (data.weather[0].main == "Rain") {
            //     weatherIcon.src = "rain.png"
            // }
            //  else if (data.weather[0].main == "Drizzle") {
            //     weatherIcon.src = "rainy-day.png"
            // }
            //  else if (data.weather[0].main == "Mist") {
            //     weatherIcon.src = "snowflake.png"
            // }



           

            searchBtn.addEventListener("click", ()=>{
                checkWeather(searchBox.value);
            document.querySelector(".weather").style.display = "block" 

            })




        }

        checkWeather();

    </script>



    <script src="/weatherApp.js"></script>
</body>
</html>
